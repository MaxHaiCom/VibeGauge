name: Build & Verify

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-14

    steps:
    - name: Checkout repository
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - name: Compile and Bundle VibeGauge
      run: |
        chmod +x ./build.sh
        ./build.sh

    - name: Run Headless Self-Test
      run: |
        ./VibeGauge.app/Contents/MacOS/VibeGauge --selftest

    - name: Test Python Proxy Self-Test
      run: |
        /usr/bin/python3 Resources/vibegauge-proxy.py --selftest
